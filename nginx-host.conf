# Variante per network_mode: host (docker/podman rootless senza pasta/tun).
# Identico a code/wiki-tube/nginx.conf ma su porta 8080 (web locale, come da README).
server {
    listen 8080;
    server_name _;
    root /var/www/html;
    index index.php;

    # Static assets (no cache: css/js cambiano spesso)
    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location ~* \.(png|jpe?g|gif|svg|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # PHP (FastCGI)
    location ~ \.php$ {
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Everything else -> index.php (single entrypoint / router)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
}
