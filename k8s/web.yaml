apiVersion: v1
kind: ConfigMap
metadata: {name: wiki-nginx, namespace: wiki}
data:
  default.conf: |
    server { listen 80; root /repo/code/wiki-tube/app; index index.php;
      location / { try_files $uri $uri/ /index.php?$query_string; }
      location ~ \.php$ { include fastcgi_params; fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name; fastcgi_pass 127.0.0.1:9000; }
      location ~* \.(css|js|jpe?g|png|svg|woff2?)$ { expires 1h; } }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: wiki}
spec:
  replicas: 1
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      nodeSelector: {kubernetes.io/hostname: wiki}
      containers:
      - name: nginx
        image: nginx:alpine
        ports: [{containerPort: 80}]
        volumeMounts:
        - {name: repo, mountPath: /repo}
        - {name: nginxconf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
      - name: php
        image: php:8.3-fpm-alpine
        envFrom: [{configMapRef: {name: wiki-env, optional: true}}]
        volumeMounts:
        - {name: repo, mountPath: /repo}
      volumes:
      - name: repo
        persistentVolumeClaim: {claimName: mortewiki}
      - name: nginxconf
        configMap: {name: wiki-nginx}
---
apiVersion: v1
kind: Service
metadata: {name: wiki-web, namespace: wiki}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
  type: ClusterIP
