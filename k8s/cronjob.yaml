apiVersion: batch/v1
kind: CronJob
metadata: {name: sync, namespace: wiki}
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector: {kubernetes.io/hostname: wiki}
          restartPolicy: OnFailure
          containers:
          - name: sync
            image: alpine/git:latest
            env:
            - {name: GIT_SSH_COMMAND, value: "ssh -o StrictHostKeyChecking=accept-new -i /key/id_ed25519"}
            command: ["/bin/sh","-c"]
            args:
            - >-
              set -e;
              apk add --no-cache git openssh-client >/dev/null 2>&1;
              cd /repo;
              git pull --rebase origin HEAD >/dev/null 2>&1 || true;
              git submodule update --init --recursive >/dev/null 2>&1 || true;
              git add -A;
              git -c user.email="wiki@loc" -c user.name="wiki" commit -m "refresh $(date -u +%F_%T)" >/dev/null 2>&1 || true;
              git push origin HEAD >/dev/null 2>&1 || true;
              echo REFRESH_DONE
            volumeMounts:
            - {name: repo, mountPath: /repo}
            - {name: key, mountPath: /key, readOnly: true}
          volumes:
          - name: repo
            persistentVolumeClaim: {claimName: mortewiki}
          - name: key
            secret: {secretName: wiki-gitkey, defaultMode: 0600}
